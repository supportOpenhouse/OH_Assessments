<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sales (Insight) assessment for Openhouse candidates." />
    <title>Openhouse · Sales Assessment</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="msapplication-TileImage" content="/mstile-150.png" />
    <!-- Brand orange in light, warm near-black in dark, so the browser chrome
         matches the paper rather than fighting it. -->
    <meta name="theme-color" content="#fa541c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- openhouse.in uses Public Sans and nothing else, so this app does too.
         Poppins carries one word — CAREERS in the logo lockup — because the
         supplied wordmark is a geometric sans and a grotesque sub-word reads as
         a different typeface bolted underneath. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Poppins:wght@600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
